# CodeRabbit configuration.
#
# The Next.js migration PR touches 223 files, over the 100-file review limit.
# Rather than split it, the filters below drop files that are vendored,
# generated or mechanically renamed, so the review lands on code that was
# actually authored here. Nothing is excluded to hide it -- each exclusion is
# justified below, and everything remains in the diff for a human to read.

language: en-GB

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true

  path_filters:
    # --- Vendored: copied verbatim from the sih2026 repo, not new code ------
    # The FastAPI service is kept only as the reference implementation the
    # TypeScript API is checked against; it is not deployed.
    - "!backend/api/**"
    # The index engine, collectors and their tests predate this PR. Only the
    # Postgres store below is new, and that IS reviewed.
    - "!backend/apix/index/**"
    - "!backend/apix/sources/**"
    - "!backend/apix/tests/**"
    - "!backend/apix/migrations/**"
    - "!backend/apix/data/**"
    - "!backend/apix/exports/**"
    - "!backend/data/**"

    # --- Generated: produced by a script, edited by regenerating -----------
    # Transcribed from the Python source so the wording cannot drift; a
    # review comment here would be answered by changing the generator.
    - "!src/server/notes.ts"
    - "!src/server/services/agent/constants.ts"

    # --- Mechanical: renames and templated shims ---------------------------
    # src/pages -> src/views, because Next reserves `pages`. Content is
    # unchanged apart from an added 'use client' directive.
    - "!src/views/**"
    # 18 near-identical page shims generated from a route table; each is four
    # lines that import a view and export metadata.
    - "!app/(console)/**/page.jsx"

    # --- Not source --------------------------------------------------------
    - "!package-lock.json"
    - "!public/**"

  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
